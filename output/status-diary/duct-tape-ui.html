<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahou Shounen Diary Asset Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&family=Kiwi+Maru:wght@400;500&display=swap');

    :root {
      --frame-img: url('assets/mahou-diary-frame-d.png');
      --subject-photo: url('assets/asdf_1.png');
      --ink: #24161f;
      --rose: #8a3357;
      --pale: #fff0f6;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 12%, rgba(238, 163, 195, .32), transparent 24%),
        linear-gradient(135deg, #f7eef2, #d8ced8);
      color: var(--ink);
      font-family: 'Kiwi Maru', serif;
    }

    .status {
      position: relative;
      width: min(980px, 100%);
      aspect-ratio: 1672 / 941;
      background-image: var(--frame-img);
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      filter: drop-shadow(0 18px 28px rgba(36, 22, 31, .28));
      overflow: hidden;
      animation: enter .55s var(--ease) both, uneasy 6.4s steps(1, end) infinite 1.3s;
    }

    .photo {
      position: absolute;
      left: 17.15%;
      top: 17.2%;
      width: 14.85%;
      height: 46.9%;
      border-radius: 18% 18% 14% 14%;
      background-image: var(--subject-photo);
      background-size: cover;
      background-position: center 12%;
      filter: saturate(.9) contrast(1.06);
      overflow: hidden;
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, transparent 38%, rgba(20, 15, 20, .72) 39% 41%, transparent 42%),
        radial-gradient(circle at 75% 78%, rgba(20,15,20,.46) 0 8px, transparent 9px),
        linear-gradient(112deg, transparent 0 45%, rgba(255,255,255,.55) 46%, transparent 49%);
      mix-blend-mode: multiply;
      opacity: .56;
      animation: photo-glitch 4.8s steps(1, end) infinite;
    }

    .field {
      position: absolute;
      left: 42%;
      width: 41.5%;
      min-height: 4.3%;
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      overflow: hidden;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255,255,255,.55);
    }

    .field b {
      color: #6a2948;
      font: 500 clamp(15px, 1.56vw, 20px)/1 'Yomogi', cursive;
      letter-spacing: .02em;
      transform: translateY(-1px);
    }

    .field span {
      font-family: 'Kiwi Maru', serif;
      font-size: clamp(12px, 1.02vw, 14px);
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateY(-1px);
    }

    .date { top: 15.7%; }
    .time { top: 22.5%; }
    .layer { top: 29.3%; }
    .location { top: 36.1%; }
    .subject { top: 42.9%; }
    .contamination { top: 49.6%; }

    .contam-value {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .hearts {
      display: inline-flex;
      gap: 2px;
      color: #c45d7c;
      font: 500 clamp(15px, 1.48vw, 21px)/1 'Yomogi', cursive;
    }

    .hearts i {
      font-style: normal;
    }

    .hearts i:nth-last-child(-n+3) {
      color: #191217;
    }

    .hearts i:nth-child(5) {
      animation: pulse .95s ease-in-out infinite;
    }

    .percent {
      color: var(--ink);
      font-weight: 700;
      margin-left: 4px;
      font-family: 'Kiwi Maru', serif;
    }

    .mono-label {
      position: absolute;
      left: 39.8%;
      top: 59.3%;
      width: 14.8%;
      transform: rotate(-3deg);
      color: var(--pale);
      font: 500 clamp(17px, 1.62vw, 24px)/1 'Yomogi', cursive;
      text-align: center;
      pointer-events: none;
    }

    .monologue {
      position: absolute;
      left: 39.5%;
      top: 66.1%;
      width: 45.4%;
      height: 18.2%;
      padding: 1.5% 2%;
      color: #33242c;
      font: 500 clamp(14px, 1.25vw, 18px)/1.28 'Yomogi', cursive;
      overflow: hidden;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(16px) rotate(-.4deg); }
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }

    @keyframes uneasy {
      0%, 91%, 100% { filter: drop-shadow(0 18px 28px rgba(36, 22, 31, .28)); }
      92% { filter: drop-shadow(0 18px 28px rgba(36, 22, 31, .28)) contrast(1.06) saturate(.9); }
      93% { transform: translateX(.5px); }
      94% { transform: translateX(-.5px); }
      95% { transform: translateX(0); }
    }

    @keyframes photo-glitch {
      0%, 84%, 100% { transform: translateX(0); opacity: .56; }
      85% { transform: translateX(-1px); opacity: .78; }
      86% { transform: translateX(1px); opacity: .44; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: none; }
      50% { transform: scale(1.18); filter: contrast(1.25); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <section class="status" aria-label="Mahou Shounen Diary status">
    <div class="photo"></div>

    <div class="field date"><b>日付</b><span>2026/01/03 (Sat)</span></div>
    <div class="field time"><b>時刻</b><span>03:42 AM</span></div>
    <div class="field layer"><b>境界</b><span>Boundary</span></div>
    <div class="field location"><b>場所</b><span>Reversed station</span></div>
    <div class="field subject"><b>対象</b><span>Haru</span></div>
    <div class="field contamination">
          <b>汚染</b>
      <span class="contam-value">
        <span class="hearts"><i>♥</i><i>♥</i><i>♥</i><i>♥</i><i>♥</i><i>♥</i><i>♥</i><i>♥</i></span>
        <span class="percent">64%</span>
      </span>
    </div>

    <div class="mono-label">内緒</div>
    <div class="monologue">The platform is empty, but something is counting us.</div>
  </section>
</body>
</html>
