# Canonical RSND/RisuAI runtime compose.
# Matches the currently active production topology on bliss's Mac mini.
# Do not switch this back to pocketrisu upstream or risuai-nodeonly_risuai-save;
# the live save volume is risuai_risuai-save.
name: risuai-nodeonly

services:
  risuai:
    container_name: risuai-nodeonly
    image: ghcr.io/blissful-y0/rsnd:latest
    pull_policy: always
    restart: always
    expose:
      - "6001"
    volumes:
      - risuai-save:/app/save
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=0
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - REPO_USER=${REPO_USER:-blissful-y0}
      - REPO_PASS=${GHCR_TOKEN}

  cloudflared-deploy:
    container_name: cloudflared-deploy
    image: cloudflare/cloudflared:latest
    restart: always
    depends_on:
      - watchtower
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro

volumes:
  risuai-save:
    external: true
    name: risuai_risuai-save
  caddy-data:
    name: risuai-nodeonly_caddy-data
  caddy-config:
    name: risuai-nodeonly_caddy-config
